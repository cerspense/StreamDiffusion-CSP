# Black input test config
model_id: "stabilityai/sdxl-turbo"

t_index_list: [16]
width: 512
height: 512
device: "cuda"
dtype: "float16"

guidance_scale: 1.0
num_inference_steps: 50
seed: 629717
delta: 1.0

prompt: "test"
negative_prompt: ""

mode: "img2img"
frame_buffer_size: 1
use_denoising_batch: true
use_lcm_lora: true
use_tiny_vae: true
acceleration: "tensorrt"
cfg_type: "self"

engine_dir: "./engines/td"

use_controlnet: false
use_ipadapter: false

# Test feedback_transform with NO feedback (strength=0) and NO color correction
image_preprocessing:
  enabled: true
  processors:
    - type: "feedback_transform"
      order: 1
      enabled: true
      params:
        requires_sync_processing: true
        feedback_strength: 0.0
        brightness: 0.0
        saturation: 1.0
        contrast: 1.0
        black_level: 0.0
        gamma: 1.0
        temperature: 0.0
        zoom: 1.0
        pan_x: 0.0
        pan_y: 0.0
        rotation: 0.0
        border_mode: zeros

td_settings:
  osc_receive_port: 9999
  osc_transmit_port: 9998
  input_mem_name: "StreamDiffusionTD_test"
  output_mem_name: "StreamDiffusionTD_test_out"
  enable_timing_stats: false
  fps_target: 30
